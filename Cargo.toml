[package]
name = "brandi"
version = "0.1.11"
edition = "2021"
description = "Brand coherence intelligence layer: lint user-facing surfaces against a machine-readable brand genome"
publish = false

[lib]
name = "brandi"
path = "src/lib.rs"

[[bin]]
name = "brandi"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
walkdir = "2"
regex = "1"
notify = "6"
form3 = { path = "../3form" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
chrono = "0.4"
sha2 = "0.10"
base64 = "0.22"
tree-sitter = "0.26.13"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
unicode-width = "0.2"
padagonia = { path = "../padagonia" }

[dev-dependencies]
tempfile = "3"
